<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Wokra — paramètres</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <p class="brand">wokra<span>.</span></p>
      <h1>Paramètres</h1>
      <p class="note">
        Wokra analyse localement le texte visible de LinkedIn. Aucune annonce ni donnée personnelle
        n’est envoyée à un serveur.
      </p>
      <p class="note">
        L’historique local sert uniquement à repérer une offre observée plusieurs fois. Il ne
        constitue pas une preuve de ghost job.
      </p>
      <button id="clear-history" type="button">Effacer l’historique local</button>
      <p id="clear-status" role="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
